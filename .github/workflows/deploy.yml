# Deploy เว็บ (Firebase Hosting) + Firestore rules ขึ้น production อัตโนมัติทุกครั้งที่ push เข้า main
# ยืนยันตัวกับ Google ผ่าน Workload Identity Federation (ไม่มีไฟล์กุญแจ/secret เก็บใน repo)
# ตั้งค่าฝั่ง Google Cloud ครั้งเดียวด้วย scripts/setup-github-deploy.sh (ดู README)
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

# กันสอง deploy ชนกันถ้า push ติดๆ กัน — ตัวหลังรอตัวแรกเสร็จก่อน
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # ให้ GitHub ออก OIDC token ไปแลกสิทธิ์กับ Google

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/144996454439/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@project-chadarat.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Deploy hosting + firestore rules
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project project-chadarat --non-interactive --debug
