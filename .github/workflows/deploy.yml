# Deploy เว็บ (Firebase Hosting) + Firestore rules ขึ้น production อัตโนมัติทุกครั้งที่ push เข้า main
# ต้องมี secret ชื่อ FIREBASE_SERVICE_ACCOUNT ใน repo (เนื้อหาไฟล์ JSON ของ service account ทั้งไฟล์)
# ดูวิธีตั้งค่าใน README หัวข้อ "Deploy อัตโนมัติด้วย GitHub Actions"
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

# กันสอง deploy ชนกันถ้า push ติดๆ กัน — ตัวหลังรอตัวแรกเสร็จก่อน
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare service account
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret FIREBASE_SERVICE_ACCOUNT — ข้ามการ deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy hosting + firestore rules
        if: steps.creds.outputs.ready == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project project-chadarat --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
